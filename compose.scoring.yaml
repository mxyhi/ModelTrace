services:
  modeltrace-scoring:
    image: modeltrace-scoring:${MODELTRACE_REVISION:-local}
    build:
      context: .
      dockerfile: Dockerfile.scoring
      args:
        VCS_REF: ${MODELTRACE_REVISION:-local}
    environment:
      MODELTRACE_INTERNAL_TOKEN: ${MODELTRACE_INTERNAL_TOKEN:?required}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${MODELTRACE_BIND_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/v1/health',headers={'Authorization':'Bearer '+os.environ['MODELTRACE_INTERNAL_TOKEN']}),timeout=5).read()"
      interval: 30s
      timeout: 6s
      retries: 3
